services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BASE_URL: "http://localhost:8080"
      APP_URL_SCHEME: "ciwatcher"
      SQLITE_PATH: "/data/ciwatcher.db"
      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-ciwatcher-native}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_PRIVATE_KEY: "${GITHUB_PRIVATE_KEY}"
    volumes:
      - api_data:/data

volumes:
  api_data:
