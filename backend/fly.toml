# fly.toml app configuration file generated for CIWatcher API
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "ciwatcher-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  APP_URL_SCHEME = "ciwatcher"
  GITHUB_APP_SLUG = "ciwatcher-native"
  SQLITE_PATH = "/data/ciwatcher.db"

[mounts]
  source = "ciwatcher_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
