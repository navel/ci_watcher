# CIWatcher API — ciwatcher.navel.uk
# Managed by /opt/ciwatcher/deploy/deploy.sh (do not edit markers by hand).

upstream ciwatcher_api {
    server ciwatcher-api:8080 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

server {
    listen 80;
    server_name ciwatcher.navel.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ciwatcher.navel.uk;

    ssl_certificate /etc/nginx/ssl/ciwatcher.navel.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ciwatcher.navel.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ciwatcher_api;
    }
}
