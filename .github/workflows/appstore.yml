name: App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  appstore:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Build and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          GITHUB_APP_ID: ${{ secrets.CIWATCHER_APP_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.CIWATCHER_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CIWATCHER_CLIENT_SECRET }}
          GITHUB_PRIVATE_KEY_BASE64: ${{ secrets.CIWATCHER_PRIVATE_KEY_BASE64 }}
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/ci/*.sh
          ./scripts/ci/build-appstore-release.sh
