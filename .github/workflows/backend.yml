name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/backend-deploy.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciwatcher
          POSTGRES_PASSWORD: ciwatcher
          POSTGRES_DB: ciwatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciwatcher -d ciwatcher"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://ciwatcher:ciwatcher@localhost:5432/ciwatcher?sslmode=disable
          BASE_URL: http://localhost:8080
          GITHUB_APP_ID: "123"
          GITHUB_PRIVATE_KEY: "placeholder"
        run: go test ./...

      - name: Build API binary
        run: go build -o /tmp/api ./cmd/api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate go.sum
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Build Docker image
        run: docker build -t ciwatcher-api:test .
