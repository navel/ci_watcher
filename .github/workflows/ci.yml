name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SharedCore unit tests
        run: |
          cd SharedCore
          swift test --filter 'GitHubAppAuthTests|GitHubAppConfigTests|SharedCoreTests'

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Secrets.xcconfig (placeholder for CI build check)
        env:
          GITHUB_APP_ID: "0"
          GITHUB_CLIENT_ID: "placeholder"
          GITHUB_PRIVATE_KEY: "placeholder"
        run: |
          chmod +x scripts/ci/generate-secrets-xcconfig.sh
          ./scripts/ci/generate-secrets-xcconfig.sh

      - name: Build macOS app
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace CIWatcher.xcworkspace \
            -scheme CIWatcher-macOS \
            -destination 'platform=macOS' \
            build
