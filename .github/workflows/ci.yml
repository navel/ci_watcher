name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run SharedCore unit tests
        run: |
          cd SharedCore
          swift test --filter 'GitHubAppAuthTests|GitHubAppConfigTests|SharedCoreTests|BackendAuthClientTests|RepositoryMigrationTests'

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate Secrets.xcconfig (placeholder for CI build check)
        env:
          GITHUB_APP_ID: "0"
          GITHUB_CLIENT_ID: "placeholder"
          CIWATCHER_API_BASE_URL: "https://ciwatcher.navel.uk"
          GITHUB_PRIVATE_KEY: ""
        run: |
          chmod +x scripts/ci/generate-secrets-xcconfig.sh
          ./scripts/ci/generate-secrets-xcconfig.sh

      - name: Build macOS app
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace CIWatcher.xcworkspace \
            -scheme CIWatcher-macOS \
            ONLY_USE_PACKAGE_VERSIONS_FROM_RESOLVED_FILE=YES
          xcodebuild -workspace CIWatcher.xcworkspace \
            -scheme CIWatcher-macOS \
            -destination 'platform=macOS' \
            ONLY_USE_PACKAGE_VERSIONS_FROM_RESOLVED_FILE=YES \
            CODE_SIGN_IDENTITY=- \
            build
